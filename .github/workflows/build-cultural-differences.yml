name: Build Cultural Differences PowerPoint

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_cultural_differences.py"
      - ".github/workflows/build-cultural-differences.yml"

permissions:
  contents: write

concurrency:
  group: cultural-differences-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PowerPoint generator
        run: python -m pip install --upgrade pip python-pptx
      - name: Generate photo-based presentation
        run: python scripts/build_cultural_differences.py
      - name: Commit generated PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lectures/Cultural_Differences_Lecture.pptx
          if git diff --cached --quiet; then
            echo "No PowerPoint changes to commit."
          else
            git commit -m "Build photo-rich Cultural Differences lecture"
            git push origin HEAD:main
          fi
